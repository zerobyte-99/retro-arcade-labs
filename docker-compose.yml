# Retro Arcade Labs - Docker Compose Configuration
# =================================================
# Intentionally vulnerable training platform - LOCAL USE ONLY

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: retro-arcade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: LOCAL_ONLY_MYSQL_ROOT_PASSWORD_456
      MYSQL_DATABASE: retro_arcade
      MYSQL_USER: retro_arcade
      MYSQL_PASSWORD: retro_password
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pLOCAL_ONLY_MYSQL_ROOT_PASSWORD_456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - retro-network
    restart: unless-stopped

  # Redis Cache/Session Store
  redis:
    image: redis:7-alpine
    container_name: retro-arcade-redis
    command: redis-server --requirepass LOCAL_ONLY_REDIS_PASSWORD
    ports:
      - "0.0.0.0:11637:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "LOCAL_ONLY_REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retro-network
    restart: unless-stopped

  # PHP Application (FPM)
  php-app:
    build:
      context: ./php-app
      dockerfile: Dockerfile
    container_name: retro-arcade-php
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=retro_arcade
      - DB_USERNAME=retro_arcade
      - DB_PASSWORD=retro_password
      - REDIS_HOST=redis
      - REDIS_PORT=11637
      - REDIS_PASSWORD=LOCAL_ONLY_REDIS_PASSWORD
      - SESSION_SECRET=LOCAL_ONLY_WEAK_SESSION_SECRET_ABC123
      - JWT_SECRET=LOCAL_ONLY_WEAK_JWT_SECRET_XYZ789
      - APP_ENV=development
      - APP_DEBUG=true
      - INTERNAL_METADATA_URL=http://internal-metadata:11081
      - MOCK_MAIL_URL=http://mock-mail:11025
    volumes:
      - ./php-app:/var/www/html:rw
      - php_uploads:/var/www/html/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - retro-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: retro-arcade-nginx
    ports:
      - "0.0.0.0:8080:80"
      - "0.0.0.0:8470:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./php-app:/var/www/html:ro
      - php_uploads:/var/www/html/uploads:ro
    depends_on:
      - php-app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - retro-network
    restart: unless-stopped

  # Internal Metadata Mock Service (SSRF Target)
  internal-metadata:
    build:
      context: ./infra/internal-metadata
      dockerfile: Dockerfile
    container_name: retro-arcade-metadata
    ports:
      - "0.0.0.0:11081:11081"
    environment:
      - PORT=11081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11081/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - retro-network
    restart: unless-stopped

  # Mock Mail Service (MailHog-compatible)
  mock-mail:
    build:
      context: ./infra/mock-mail
      dockerfile: Dockerfile
    container_name: retro-arcade-mail
    ports:
      - "0.0.0.0:11025:11025"
    environment:
      - MH_API_PORT=11025
      - MH_SMTP_PORT=11025
      - MH_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11025 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - retro-network
    restart: unless-stopped

# Volumes for persistent data
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  php_uploads:
    driver: local

# Custom network for service isolation
networks:
  retro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16